<style>

    *{box-sizing:border-box}

p:26px}.form-actions .primary{flex:1;border-radius:12px}.form-actions .secondary{border-radius:12px}.review-list{margin:24px 0;display:grid;gap:12px}.review-list div{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}.review-list dt{font-size:12px;color:var(--muted);margin-bottom:6px}.review-list dd{margin:0;font-weight:650}.form-fields{border:0;padding:0;margin:0;min-width:0}.profile-modal .form{max-height:88vh;overflow:auto}.profile .logout{background:transparent;margin-top:8px;color:#b9c2dd}.profile-caption{color:#b9c2dd;font-size:12px;line-height:1.6;overflow-wrap:anywhere;margin-bottom:12px}.demo-bar{position:relative;background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);z-index:40}.demo-bar strong{color:var(--brand)}.demo-bar details{white-space:nowrap}.demo-controls{position:absolute;right:18px;top:40px;background:white;padding:18px;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;width:320px;white-space:normal}.demo-controls button{display:block;margin:8px 0;width:100%;font-size:12px}.demo-controls label{display:block;margin:10px 0;line-height:1.5}.demo-controls small{display:block;line-height:1.6}.list-heading{border:0;padding:0;background:none;text-align:left;color:inherit;font-size:19px;font-weight:800;line-height:1.5}.summary div{line-height:1.6}.calendar-status{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.6}.undated button{width:100%;text-align:left;margin:5px 0}.detail-grid p{line-height:1.7}.detail-panel h2{line-height:1.4}.event{line-height:1.5}.statebox{line-height:1.8}.statebox button{display:block;margin:16px auto 0}.spinner{display:inline-block;border:2px solid #cad5ff;border-top-color:var(--brand);width:18px;height:18px;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}.statebox.visible{display:block}.favorite{flex-shrink:0}.section.active,.auth-card{animation:enter .18s ease}.detail.open .detail-panel,.profile-modal.open .form{animation:enter .18s ease}.field-error:empty{display:none}.empty-selection{color:var(--muted);font-size:13px}fieldset:disabled .chip{cursor:wait}.profile form h2{margin:6px 0 10px}

<script>
'use strict';
// Design-only state. Never store passwords or real authentication tokens here.
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INTERESTS=['AI','개발','창업','취업','장학'];

const TODAY='2026-09-21'; // Fixed fixture date, NOT recommendation recency weight.
const STORAGE='scnu-pick-design-v2';
const emptyProfile=()=>({department:'',year:'',status:'',interests:[],activities:[]});
const seed=()=>({email:null,pendingEmail:'',resetEmail:'',users:{'demo@example.com':{verified:true,complete:true,profile:{department:'컴퓨터공학과',year:'2학년',status:'재학',interests:['AI','개발'],activities:['프로젝트']},draft:emptyProfile(),favorites:[]}}});
let state=seed();try{const saved=JSON.parse(sessionStorage.getItem(STORAGE));if(saved?.users&&saved.users['demo@example.com'])state=saved;}catch{}
function persist(){try{sessionStorage.setItem(STORAGE,JSON.stringify(state));}catch{showToast('이 브라우저에서는 새로고침 후 시연 상태가 유지되지 않을 수 있어요.');}}

let year=2026,month=8;
const filters={recommend:{search:'',category:'전체',urgent:false,source:'전체 출처'},new:{search:'',category:'전체',urgent:false,source:'전체 출처'}};
const listStates={recommend:'ready',new:'ready'};
const notices=[
{id:'ai',title:'AI 실무 프로젝트 참가자 모집',source:'AI인재양성부트캠프사업단',published:'2026-09-20',category:'교육/특강',target:'재학생 / 2~4학년',years:['2학년','3학년','4학년'],statuses:['재학'],departments:[],interests:['AI','개발'],activities:['프로젝트','멘토링'],activity:'팀 프로젝트 · 멘토링',start:'2026-09-18',deadline:'2026-09-25',eventStart:'2026-10-02',eventEnd:'2026-11-20',mileage:[],prize:{status:'미기재'},url:null},
{id:'sw',title:'SW 비교과 특강: 오픈소스 협업',source:'SW중심대학사업단',published:'2026-09-19',category:'교육/특강',target:'전 학년',years:[],statuses:[],departments:[],interests:['개발'],activities:['특강'],activity:'특강 · 실습',start:null,deadline:'2026-10-01',eventStart:'2026-10-05',eventEnd:'2026-10-05',mileage:[{system:'SW 비교과 마일리지',points:10,condition:'특강 전체 이수 (가상 예시)'}],prize:{status:'없음'},url:null},

const dayDiff=date=>date?Math.round((Date.parse(date+'T00:00:00+09:00')-Date.parse(TODAY+'T00:00:00+09:00'))/86400000):null;
const isClosed=n=>n.deadline&&n.deadline<TODAY;
function matches(n){const p=current().profile;return [(!n.years.length||n.years.includes(p.year))&&(!n.statuses.length||n.statuses.includes(p.status))&&(!n.departments.length||n.departments.includes(p.department)),n.interests.some(x=>p.interests.includes(x)),n.activities.some(x=>p.activities.includes(x))];}
function reason(n){const m=matches(n),p=current().profile,parts=[];if(m[0])parts.push('학적 조건');if(m[1])parts.push('관심 분야 '+n.interests.filter(x=>p.interests.includes(x)).join('·'));if(m[2])parts.push('활동 유형 '+n.activities.filter(x=>p.activities.includes(x)).join('·'));return parts.length?parts.join(', ')+' 일치':'선택한 관심 분야·활동 유형과 일치하는 항목이 없어요.';}

function safeRoute(){let r=location.hash.replace(/^#\/?/,'')||'login';const u=current();const guarded=['academic','preferences','complete','recommend','new','calendar'];if(guarded.includes(r)){if(!u)return'login';if(!u.verified)return'verify';if(!u.complete&&['complete','recommend','new','calendar'].includes(r))return u.draft.department?'preferences':'academic';if(u.complete&&['academic','preferences'].includes(r))return'recommend';}if(r==='verify'&&!state.users[state.pendingEmail])return'login';if(['reset-sent','reset-password','reset-done'].includes(r)&&!state.resetEmail)return'forgot';return ['login','signup','verify','forgot','reset-sent','reset-password','reset-done',...guarded].includes(r)?r:'login';}
function render(){closeModal(false);const route=safeRoute();$('#root').dataset.route=route;if(location.hash!=='#/'+route)history.replaceState(null,'','#/'+route);$('#root').innerHTML=['recommend','new','calendar'].includes(route)?appShell(route):authShell(route);if(['recommend','new'].includes(route))renderList(route);if(route==='calendar')renderCal();updateResend();requestAnimationFrame(()=>$('#root h1')?.focus({preventScroll:true}));}
function steps(active){return '<ol class="steps" aria-label="최초 등록 단계">'+['학적 정보','관심사 선택','등록 완료'].map((t,i)=>`<li class="${i===active?'current':''}" ${i===active?'aria-current="step"':''}>0${i+1}　${t}</li>`).join('')+'</ol>';}
function authShell(route){return `<div class="auth-shell"><aside class="auth-story"><div class="brand">SCNU PICK<small>순천대학교 교내 공지 추천 서비스</small></div><div><span class="eyebrow">YOUR NEXT OPPORTUNITY</span><h2>흩어진 공지 속,<br>나에게 맞는 기회.</h2><p>학적과 관심사에 맞는 공지를 모으고<br>찜한 일정은 캘린더에서 확인하세요.</p><div class="story-preview"><span class="badge score">나의 관심사와 연결된 공지</span><b>관심 있는 활동을 발견하는 시작</b><p style="margin-bottom:0;font-size:13px">맞춤 추천 → 공지 확인 → 찜과 일정 관리</p></div></div><p class="story-footer">신청과 자격 확인은 각 운영기관의 원문 안내를 따라요.</p></aside><main class="auth-area"><div class="auth-card ${['academic','preferences','complete'].includes(route)?'wide':''}">${authContent(route)}</div></main></div>`;}
function emailField(value='',id='email'){return field(id,'이메일',`<input id="${id}" name="email" type="email" autocomplete="email" value="${esc(value)}" placeholder="name@example.com" maxlength="254" aria-describedby="${id}-error" required>`);}
function field(id,label,input,help=''){return `<div class="field"><label for="${id}">${label}</label>${input}${help?`<p class="field-help">${help}</p>`:''}<span id="${id}-error" class="field-error" aria-live="polite"></span></div>`;}
function passwordField(id,label,repeat=false){return field(id,label,`<div class="password-wrap"><input id="${id}" name="${id}" type="password" minlength="8" maxlength="128" autocomplete="${repeat?'new-password':'current-password'}" aria-describedby="${id}-error" placeholder="8자 이상 입력" required><button type="button" class="secondary" data-show-password="${id}" aria-label="${label} 표시" aria-pressed="false">보기</button></div>`);}
function formWrap(id,content,submit){return `<form id="${id}" novalidate><div class="error-banner" data-form-error role="alert" hidden></div><fieldset class="form-fields">${content}<button class="primary full" type="submit">${submit}</button></fieldset></form>`;}
function authContent(r){
if(r==='login')return `<h1 tabindex="-1">다시 만나 반가워요</h1><p class="subtitle">내게 필요한 교내 소식, SCNU PICK에서 시작하세요.</p>${formWrap('loginForm',emailField()+passwordField('password','비밀번호')+'<div class="split"><span class="field-help">학교 메일이 아니어도 괜찮아요.</span><button type="button" class="link-btn" data-route="forgot">비밀번호를 잊으셨나요?</button></div>','로그인')}<p class="auth-links">아직 계정이 없나요? <button class="link-btn" data-route="signup">회원가입</button></p>`;
if(r==='signup')return `<span class="eyebrow" style="color:var(--brand)">START WITH SCNU PICK</span><h1 tabindex="-1" style="margin-top:12px">나에게 맞는 기회, 시작하기</h1><p class="subtitle">이메일로 간편하게 가입하세요.</p>${formWrap('signupForm',emailField()+passwordField('password','비밀번호',true)+passwordField('passwordConfirm','비밀번호 확인',true)+'<div class="notice">일반 이메일을 사용할 수 있어요. 메일 확인은 계정 소유 확인을 위한 절차이며, 순천대 학생 인증은 진행하지 않아요.</div>','가입하고 이메일 확인')}<p class="auth-links">이미 계정이 있나요? <button class="link-btn" data-route="login">로그인</button></p>`;
if(r==='verify')return `<div class="status-icon" aria-hidden="true">✉</div><h1 tabindex="-1">이메일을 확인해 주세요</h1><p class="subtitle"><b>${esc(state.pendingEmail)}</b><br>메일의 확인 링크를 누르면 최초 등록으로 이어져요.</p><div id="verifyStatus" class="${linkExpired?'error-banner':'notice'}" role="status">${linkExpired?'링크가 만료되었어요. 확인 메일을 다시 받아주세요.':'메일이 보이지 않으면 스팸함도 확인해 주세요.'}</div><div class="error-banner" data-form-error role="alert" hidden></div><button class="primary full" data-action="verify-check">메일 확인 상태 확인</button><button class="secondary full" style="margin-top:12px" data-action="resend">확인 메일 다시 보내기</button><p class="auth-links"><button class="link-btn" data-route="signup">다른 이메일로 가입</button> · <button class="link-btn" data-route="login">로그인으로</button></p><p class="field-help">시연에서는 상단 ‘시연 도구 → 메일 확인 성공 시연’으로 다음 단계에 진입해요.</p>`;
if(r==='forgot')return `<button class="link-btn" data-route="login">← 로그인으로</button><h1 tabindex="-1" style="margin-top:18px">비밀번호를 잊으셨나요?</h1><p class="subtitle">가입한 이메일을 입력해 주세요.<br>비밀번호를 다시 설정할 수 있는 링크를 안내해요.</p>${formWrap('forgotForm',emailField(),'재설정 링크 요청')}`;
if(r==='reset-sent')return `<div class="status-icon" aria-hidden="true">✉</div><h1 tabindex="-1">메일함을 확인해 주세요</h1><p class="subtitle">입력한 이메일로 등록된 계정이 있다면<br>비밀번호 재설정 안내를 보내드려요.</p><div class="notice">스팸함도 확인해 주세요. 링크는 한 번만 사용할 수 있으며 유효 시간이 지나면 다시 요청해야 해요.</div><button class="primary full" data-route="forgot">재설정 메일 다시 요청</button><p class="auth-links"><button class="link-btn" data-route="login">로그인으로</button></p><p class="field-help">상단 시연 도구에서 ‘재설정 메일 링크 열기’를 선택하세요.</p>`;
if(r==='reset-password'){if(!resetValid||linkExpired)return `<div class="status-icon">!</div><h1 tabindex="-1">사용할 수 없는 링크예요</h1><p class="subtitle">링크가 만료되었거나 이미 사용되었어요.<br>재설정 메일을 다시 요청해 주세요.</p><button class="primary full" data-route="forgot">새 링크 요청</button>`;return `<h1 tabindex="-1">새 비밀번호 설정</h1><p class="subtitle">새롭게 사용할 비밀번호를 입력해 주세요.</p>${formWrap('resetForm',passwordField('password','새 비밀번호',true)+passwordField('passwordConfirm','새 비밀번호 확인',true),'비밀번호 변경')}`;}
if(r==='reset-done')return `<div class="status-icon">✓</div><h1 tabindex="-1">비밀번호 설정이 완료됐어요</h1><p class="subtitle">새 비밀번호로 다시 로그인해 주세요.</p><button class="primary full" data-route="login">로그인으로</button><p class="field-help" style="margin-top:16px">디자인 시연에서는 비밀번호를 실제 저장하거나 변경하지 않아요.</p>`;
if(r==='academic')return `${steps(0)}<h1 tabindex="-1">어떤 학교생활을 하고 있나요?</h1><p class="subtitle">공지의 참여 대상과 맞는지 확인하기 위해 필요해요.<br>등록한 정보는 언제든 내 정보에서 바꿀 수 있어요.</p>${formWrap('academicForm',academicFields(current().draft),'다음 · 관심사 선택')}<p class="auth-links"><button class="link-btn" data-action="logout">로그아웃</button></p>`;
if(r==='preferences')return `${steps(1)}<h1 tabindex="-1">관심 있는 기회를 골라 주세요</h1><p class="subtitle">관심 분야와 활동 유형을 각각 1개 이상 선택해 주세요.<br>여러 개 골라도 좋아요. 나중에 수정할 수 있어요.</p><form id="preferencesForm" novalidate><div class="error-banner" data-form-error role="alert" hidden></div><fieldset class="form-fields">${choiceFields(current().draft)}<div class="form-actions"><button type="button" class="secondary" data-action="academic-back">← 이전</button><button class="primary" type="submit">선택 완료</button></div></fieldset></form>`;
if(r==='complete'){const p=current().profile;return `${steps(2)}<div class="status-icon">✓</div><h1 tabindex="-1">맞춤 공지를 만날 준비 완료!</h1><p class="subtitle">아래 정보를 바탕으로 나에게 맞는 공지를 찾아드려요.</p><dl class="review-list"><div><dt>학적 정보</dt><dd>${esc(p.department)} · ${esc(p.year)} · ${esc(p.status)}</dd></div><div><dt>관심 분야</dt><dd>${p.interests.map(esc).join(' · ')}</dd></div><div><dt>활동 유형</dt><dd>${p.activities.map(esc).join(' · ')}</dd></div></dl><button class="primary full" data-route="recommend">추천 공지 보러 가기 →</button><p class="field-help" style="margin-top:16px">학적·관심사를 바꿔도 기존 찜과 캘린더는 유지돼요.</p>`;}}
function academicFields(p,prefix=''){return field(prefix+'department','학과',`<input id="${prefix}department" name="department" value="${esc(p.department)}" placeholder="예: 컴퓨터공학과" maxlength="60" autocomplete="off" aria-describedby="${prefix}department-error" required>`,'소속 학과명을 직접 입력해 주세요.')+selectField(prefix+'year','학년',['1학년','2학년','3학년','4학년','5학년 이상'],p.year)+selectField(prefix+'status','학적 상태',['재학','휴학','기타'],p.status);}
function selectField(id,label,options,value){return field(id,label,`<select id="${id}" name="${id.replace('edit-','')}" aria-describedby="${id}-error" required><option value="">선택해 주세요</option>${options.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`);}
function choiceFields(p){return [['interests','관심 분야',INTERESTS],['activities','활동 유형',ACTIVITIES]].map(([key,label,options])=>`<fieldset class="choice-section" data-choice-group="${key}" aria-describedby="${key}-error"><legend>${label}<span class="selection-count">${p[key].length}개 선택</span></legend><p class="field-help">1개 이상 · 복수 선택 가능</p><div class="interest-grid">${options.map(x=>`<button type="button" class="chip ${p[key].includes(x)?'active':''}" data-choice="${key}" data-value="${x}" aria-pressed="${p[key].includes(x)}">${x}</button>`).join('')}</div><p class="empty-selection" ${p[key].length?'hidden':''}>아직 선택한 항목이 없어요.</p><span class="field-error" id="${key}-error" aria-live="polite"></span></fieldset>`).join('');}
function appShell(route){const p=current().profile;return `<div class="app"><aside class="sidebar"><div class="brand">SCNU PICK<small>교내 공지 추천 서비스</small></div><nav class="nav" aria-label="주 메뉴">${[['recommend','추천 공지'],['new','신규 공지'],['calendar','내 캘린더']].map(([id,t])=>`<button class="${route===id?'active':''}" data-route="${id}" ${route===id?'aria-current="page"':''}>${t}</button>`).join('')}</nav><div class="profile"><div class="profile-caption">${esc(p.department)} · ${esc(p.year)} · ${esc(p.status)}</div><button data-action="profile">내 정보 수정</button><button class="logout" data-action="logout">로그아웃</button></div></aside><main><section class="section active" id="${route}"><div class="topbar"><div><h1 tabindex="-1">${{recommend:'추천 공지',new:'신규 공지',calendar:'내 캘린더'}[route]}</h1><p class="subtitle">${{recommend:'학적·관심 분야·활동 유형을 바탕으로 추천해요.',new:'원문 등록일 기준 최신 공지를 확인하세요.',calendar:'찜한 공지의 신청 일정과 실제 행사 일정을 한눈에 봐요.'}[route]}</p></div>${route==='recommend'?'<button class="secondary" data-action="profile">관심사 변경</button>':''}</div>${route==='calendar'?calendarShell():listShell(route)}</section></main></div>`;}
function listShell(route){const f=filters[route];return `<div class="toolbar"><input id="listSearch" class="search" aria-label="공지 제목이나 키워드 검색" placeholder="공지 제목이나 키워드 검색" value="${esc(f.search)}">${route==='new'?`<select id="sourceFilter" class="secondary" aria-label="출처">${['전체 출처','순천대학교 대표 공지','SW중심대학사업단','AI인재양성부트캠프사업단'].map(x=>`<option ${f.source===x?'selected':''}>${x}</option>`).join('')}</select>`:''}<details><summary class="secondary">목록 상태 시연</summary><div class="toolbar" style="margin-top:8px">${['loading','empty','error','ready'].map((s,i)=>`<button class="secondary" data-list-state="${s}">${['로딩','빈 상태','오류','정상'][i]}</button>`).join('')}</div></details></div><div class="filters">${['전체','장학/지원','대외활동','교육/특강'].map(x=>`<button class="chip ${f.category===x?'active':''}" aria-pressed="${f.category===x}" data-filter="${x}">${x}</button>`).join('')}<button class="chip ${f.urgent?'active':''}" aria-pressed="${f.urgent}" data-action="urgent">마감 임박</button><button class="chip" data-action="reset-filters">초기화</button></div><p class="field-help" style="margin-bottom:16px">가상 공지 · ${route==='recommend'?'조건 일치 수로만 정렬한 시연이며 실제 추천 점수·가중치는 미확정입니다.':'원문 등록일 최신순입니다.'} 마감 임박은 7일 이내 시연값입니다.</p><div class="cards" id="listCards"></div><div class="statebox" id="listState" role="status" aria-live="polite"></div>`;}
function renderList(route){if(!$('#listCards'))return;const f=filters[route];let list=notices.filter(n=>route==='new'||!isClosed(n));list=list.filter(n=>(n.title+' '+n.source+' '+n.activity+' '+n.interests.join(' ')).toLowerCase().includes(f.search.toLowerCase())&&(f.category==='전체'||f.category===n.category)&&(f.source==='전체 출처'||f.source===n.source)&&(!f.urgent||(dayDiff(n.deadline)!==null&&dayDiff(n.deadline)>=0&&dayDiff(n.deadline)<=7)));list.sort(route==='recommend'?(a,b)=>matches(b).filter(Boolean).length-matches(a).filter(Boolean).length:(a,b)=>b.published.localeCompare(a.published));const s=listStates[route];const box=$('#listState');$('#listCards').innerHTML=s==='ready'?list.map(n=>noticeCard(n,route)).join(''):'';box.classList.toggle('visible',s!=='ready'||!list.length);box.innerHTML=s==='loading'?'<span class="spinner" aria-hidden="true"></span>공지를 불러오는 중이에요.':s==='error'?'공지를 불러오지 못했어요.<button class="secondary" data-action="retry-list">다시 시도</button>':s==='empty'||!list.length?'조건에 맞는 공지가 없어요.<button class="secondary" data-action="reset-filters">필터 초기화</button>':'';}
function noticeCard(n,route){const on=current().favorites.includes(n.id);return `<article class="card" data-notice="${n.id}"><div class="card-head"><div><div class="source">${n.source} · ${n.published}</div><h2 class="title"><button class="list-heading" data-detail="${n.id}">${n.title}</button></h2><div class="meta">${route==='recommend'?`<span class="badge score">조건 일치 ${matches(n).filter(Boolean).length}/3</span>`:''}<span class="badge ${!isClosed(n)&&n.deadline?'dday':''}">${badge(n)}</span></div></div>${favoriteButton(n.id,on)}</div><div class="summary"><div><b>대상</b>${n.target}</div><div><b>활동</b>${n.activity}</div><div><b>일정</b>${schedule(n)}</div></div>${route==='recommend'?`<div class="reason">${esc(reason(n))}</div>`:''}</article>`;}
function favoriteButton(id,on){return `<button class="favorite ${on?'on':''}" data-favorite="${id}" aria-label="${esc(notices.find(n=>n.id===id).title)} 찜 ${on?'해제':'추가'}" aria-pressed="${on}">${on?'♥':'♡'}</button>`;}
function calendarShell(){return `<div class="calendar-wrap"><div class="calendar"><div class="cal-head"><button class="secondary" data-action="prev-month" aria-label="이전 달">←</button><strong id="monthLabel" aria-live="polite"></strong><button class="secondary" data-action="next-month" aria-label="다음 달">→</button></div><div class="cal-grid" id="calendarGrid"></div><div id="calendarStatus" class="calendar-status" role="status"></div></div><aside class="side-panel"><h3>일정 구분</h3><p><span class="badge">신청 일정</span> 신청 시작·마감</p><p><span class="badge" style="background:#eef9f0;color:#237a3b">행사 일정</span> 실제 활동·행사</p><p class="field-help">여러 날의 행사는 시작·종료 마커로 표시해요. 신청 마감 후에도 찜한 행사는 남아요.</p><div class="undated"><h3>일정 미정</h3><div id="undatedList"></div></div></aside></div>`;}
function eventsFor(n){return [[n.start,'신청 시작',''],[n.deadline,'신청 마감',''],[n.eventStart,n.eventStart===n.eventEnd?'행사':'행사 시작','activity'],[n.eventEnd!==n.eventStart?n.eventEnd:null,'행사 종료','activity']].filter(x=>x[0]);}
function renderCal(){const saved=notices.filter(n=>current().favorites.includes(n.id));$('#monthLabel').textContent=`${year}년 ${month+1}월`;let html=['일','월','화','수','목','금','토'].map(d=>`<div class="day" style="min-height:38px"><b>${d}</b></div>`).join('');const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let count=0;for(let i=0;i<Math.ceil((first+days)/7)*7;i++){const d=i-first+1;if(d<1||d>days){html+='<div class="day muted" aria-hidden="true"></div>';continue;}const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let events='';for(const n of saved)for(const [day,label,type]of eventsFor(n))if(day===date){count++;events+=`<button class="event ${type}" data-detail="${n.id}" aria-label="${date} ${label} ${n.title}">${label} · ${n.title}</button>`;}html+=`<div class="day"><div class="date">${d}</div>${events}</div>`;}$('#calendarGrid').innerHTML=html;$('#calendarStatus').textContent=!saved.length?'아직 찜한 공지가 없어요. 공지의 하트를 눌러 일정을 모아보세요.':count?`이번 달 일정 ${count}개 · 찜 ${saved.length}개`:'이번 달에 표시할 일정 마커가 없어요. 다른 달이나 일정 미정 목록을 확인해 주세요.';const undated=saved.filter(n=>!eventsFor(n).length);$('#undatedList').innerHTML=undated.length?undated.map(n=>`<button class="secondary" data-detail="${n.id}">${n.title}<br><small>일정 미정</small></button>`).join(''):'<p class="field-help">날짜가 전혀 없는 찜 공지가 없어요.</p>';}
function openDetail(id){const n=notices.find(n=>n.id===id);if(!n)return;detailId=id;modalTrigger=document.activeElement;$('#detail').innerHTML=`<div class="detail-panel"><div class="card-head"><div><div class="source">${n.source} · 가상 예시</div><h2 id="detailTitle">${n.title}</h2></div><button class="secondary" data-action="close-modal">닫기</button></div><div class="detail-grid"><div class="info"><b>대상</b><p>${n.target}</p></div><div class="info"><b>신청 일정</b><p>시작: ${n.start||'일정 미정'}<br>마감: ${n.deadline||'일정 미정'}</p></div><div class="info"><b>활동 · 행사 일정</b><p>${n.activity}<br>시작: ${n.eventStart||'일정 미정'}<br>종료: ${n.eventEnd||'일정 미정'}</p></div><div class="info"><b>혜택</b><p>${n.mileage.length?n.mileage.map(m=>`${m.system} ${m.points}점<br>조건: ${m.condition}`).join('<br>'):'마일리지: 미기재'}<br>상금: ${n.prize.status}${n.prize.amount?'<br>'+n.prize.amount+' · '+n.prize.condition:''}</p></div><div class="info" style="grid-column:1/-1"><b>추천 기준과의 관계</b><p>${esc(reason(n))}</p></div></div><p class="field-help" style="margin:18px 0">원문에 없는 혜택·날짜는 추정하지 않아요. 서로 다른 마일리지는 합산하지 않아요.</p><div class="toolbar"><button class="primary" data-action="source">원문 보기</button>${favoriteButton(n.id,current().favorites.includes(n.id))}</div><p class="field-help" style="margin-top:12px">가상 예시라 연결된 원문이 없어요. 실제 신청은 운영기관에서 진행해요.</p></div>`;openModal($('#detail'));}
function openProfile(){modalTrigger=document.activeElement;profileDraft=structuredClone(current().profile);$('#profileModal').innerHTML=`<form class="form" id="profileForm" novalidate><div class="card-head"><div><div class="source">내 정보</div><h2 id="profileTitle">학적·관심사 수정</h2></div><button type="button" class="secondary" data-action="close-modal">닫기</button></div><div class="error-banner" data-form-error role="alert" hidden></div><fieldset class="form-fields">${academicFields(profileDraft,'edit-')}${choiceFields(profileDraft)}<p class="field-help">저장하면 추천이 갱신돼요. 기존 찜과 캘린더는 유지돼요.</p><div class="form-actions"><button type="button" class="secondary" data-action="close-modal">취소</button><button class="primary" type="submit">저장</button></div></fieldset></form>`;openModal($('#profileModal'));}
function openModal(el){el.classList.add('open');$('#root').inert=true;$('.demo-bar').inert=true;document.body.style.overflow='hidden';el.querySelector('button,input')?.focus();}
function closeModal(restore=true){if(busy)return;const open=$('.detail.open,.profile-modal.open');if(!open)return;open.classList.remove('open');open.innerHTML='';$('#root').inert=false;$('.demo-bar').inert=false;document.body.style.overflow='';if(restore&&modalTrigger?.isConnected)modalTrigger.focus();profileDraft=null;}
function formError(form,message){const el=form.querySelector('[data-form-error]');el.textContent=message;el.hidden=false;}
function clearErrors(form){form.querySelectorAll('.field-error').forEach(x=>x.textContent='');form.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));const box=form.querySelector('[data-form-error]');if(box)box.hidden=true;}
function invalid(form,id,msg){const el=form.querySelector('#'+id);if(el){el.setAttribute('aria-invalid','true');form.querySelector('#'+id+'-error').textContent=msg;}return false;}
function validateEmail(form){const input=form.querySelector('[name=email]');if(!input.value.trim()||input.validity.typeMismatch||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim()))return invalid(form,input.id,'올바른 이메일 주소를 입력해 주세요.');return true;}
function validatePassword(form,confirm=false){const input=form.querySelector('#password');let ok=true;if(input.value.length<8||input.value.length>128)ok=invalid(form,'password','비밀번호를 8~128자로 입력해 주세요.');if(confirm&&form.querySelector('#passwordConfirm').value!==input.value)ok=invalid(form,'passwordConfirm','비밀번호가 일치하지 않아요.');return ok;}
function academicFrom(form){return {department:form.elements.department.value.trim(),year:form.elements.year.value,status:form.elements.status.value};}
function validateAcademic(form,p,prefix=''){let ok=true;if(!p.department||p.department.length>60)ok=invalid(form,prefix+'department','학과명을 1~60자로 입력해 주세요.');if(!p.year)ok=invalid(form,prefix+'year','학년을 선택해 주세요.');if(!p.status)ok=invalid(form,prefix+'status','학적 상태를 선택해 주세요.');return ok;}
function validateChoices(form,p){let ok=true;for(const key of ['interests','activities'])if(!p[key].length){form.querySelector('#'+key+'-error').textContent='1개 이상 선택해 주세요.';form.querySelector(`[data-choice-group="${key}"]`).setAttribute('aria-invalid','true');ok=false;}return ok;}
function focusError(form){const target=form.querySelector('input[aria-invalid=true],select[aria-invalid=true]')||form.querySelector('[data-choice-group][aria-invalid=true] button');target?.focus();}
async function request(scope,run){if(busy)return;busy=true;const controls=[...scope.querySelectorAll('button,input,select,fieldset')];const prev=controls.map(x=>x.disabled);controls.forEach(x=>x.disabled=true);scope.setAttribute('aria-busy','true');const submit=scope.querySelector('[type=submit]'),label=submit?.textContent;if(submit)submit.textContent='처리 중…';let error=null;try{await new Promise(r=>setTimeout(r,500));if($('#failNext').checked){$('#failNext').checked=false;throw Error('연결하지 못했어요. 입력한 내용은 유지돼요. 다시 시도해 주세요.');}}catch(e){error=e;}finally{busy=false;controls.forEach((x,i)=>x.disabled=prev[i]);scope.removeAttribute('aria-busy');if(submit)submit.textContent=label;}if(error){if(scope.querySelector('[data-form-error]'))formError(scope,error.message);else showToast(error.message);return false;}run();return true;}
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(busy)return;clearErrors(form);let ok=true;
if(['loginForm','signupForm','forgotForm'].includes(form.id))ok=validateEmail(form)&&ok;
if(['loginForm','signupForm','resetForm'].includes(form.id))ok=validatePassword(form,form.id!=='loginForm')&&ok;
let p;if(['academicForm','profileForm'].includes(form.id)){p=academicFrom(form);ok=validateAcademic(form,p,form.id==='profileForm'?'edit-':'')&&ok;}
if(form.id==='preferencesForm')ok=validateChoices(form,current().draft)&&ok;
if(form.id==='profileForm')ok=validateChoices(form,profileDraft)&&ok;
if(!ok){focusError(form);return;}const email=form.elements.email?.value.trim().toLowerCase();
await request(form,()=>{
if(form.id==='loginForm'){if($('#badLogin').checked||!state.users[email]){$('#badLogin').checked=false;formError(form,'이메일 또는 비밀번호를 확인해 주세요.');return;}state.email=email;const u=current();persist();if(!u.verified){state.pendingEmail=email;persist();go('verify');}else go(u.complete?'recommend':u.draft.department?'preferences':'academic');}
if(form.id==='signupForm'){if(state.users[email]){formError(form,'가입을 진행할 수 없어요. 기존 계정으로 로그인하거나 비밀번호를 재설정해 주세요.');return;}state.users[email]={verified:false,complete:false,profile:emptyProfile(),draft:emptyProfile(),favorites:[]};state.pendingEmail=email;state.email=null;linkExpired=false;resendUntil=Date.now()+30000;persist();go('verify');}
if(form.id==='forgotForm'){state.resetEmail=email;resetValid=false;linkExpired=false;persist();go('reset-sent');}
if(form.id==='resetForm'){if(!resetValid||linkExpired){go('reset-password');return;}resetValid=false;state.email=null;persist();go('reset-done');}
if(form.id==='academicForm'){Object.assign(current().draft,p);persist();go('preferences');}
if(form.id==='preferencesForm'){current().profile=structuredClone(current().draft);current().complete=true;persist();go('complete');}
if(form.id==='profileForm'){current().profile={...p,interests:[...profileDraft.interests],activities:[...profileDraft.activities]};persist();closeModal();render();showToast('저장했어요. 새 정보로 추천을 갱신했어요. 찜과 캘린더는 유지돼요.');}
});});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(busy)return;if(!b){const card=e.target.closest('[data-notice]');if(card)openDetail(card.dataset.notice);return;}if(b.disabled)return;
if(b.dataset.route){go(b.dataset.route);return;}
if(b.dataset.showPassword){const input=$('#'+b.dataset.showPassword),show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'숨기기':'보기';b.setAttribute('aria-pressed',show);return;}
if(b.dataset.choice){const key=b.dataset.choice,p=profileDraft||current().draft,v=b.dataset.value;p[key]=p[key].includes(v)?p[key].filter(x=>x!==v):[...p[key],v];b.classList.toggle('active',p[key].includes(v));b.setAttribute('aria-pressed',p[key].includes(v));const group=b.closest('fieldset');group.querySelector('.selection-count').textContent=p[key].length+'개 선택';group.querySelector('.empty-selection').hidden=!!p[key].length;group.querySelector('.field-error').textContent='';group.removeAttribute('aria-invalid');if(!profileDraft)persist();return;}
if(b.dataset.detail){openDetail(b.dataset.detail);return;}
if(b.dataset.favorite){const id=b.dataset.favorite;await request(b.parentElement,()=>{const f=current().favorites;current().favorites=f.includes(id)?f.filter(x=>x!==id):[...f,id];persist();$$(`[data-favorite="${id}"]`).forEach(x=>{const on=current().favorites.includes(id);x.classList.toggle('on',on);x.textContent=on?'♥':'♡';x.setAttribute('aria-pressed',on);x.setAttribute('aria-label',notices.find(n=>n.id===id).title+' 찜 '+(on?'해제':'추가'));});if($('#calendarGrid'))renderCal();showToast(current().favorites.includes(id)?'찜했어요. 날짜가 있으면 캘린더에 표시돼요.':'찜과 연결된 일정을 해제했어요.');});return;}
const route=safeRoute();if(b.dataset.filter){filters[route].category=b.dataset.filter;render();return;}if(b.dataset.listState){listStates[route]=b.dataset.listState;renderList(route);return;}
switch(b.dataset.action){
case'demo-existing':state.email='demo@example.com';persist();$('#demoTools').open=false;go('recommend');break;
case'logout':state.email=null;persist();go('login');break;
case'reset-demo':state=seed();linkExpired=false;resetValid=false;resendUntil=0;for(const f of Object.values(filters))Object.assign(f,{search:'',category:'전체',urgent:false,source:'전체 출처'});listStates.recommend=listStates.new='ready';$('#failNext').checked=$('#badLogin').checked=false;year=2026;month=8;persist();$('#demoTools').open=false;go('login');break;
case'verify-ok':if(route!=='verify'){showToast('회원가입 후 메일 확인 화면에서 사용해 주세요.');break;}if(linkExpired){showToast('만료된 링크예요. 메일을 다시 요청해 주세요.');break;}await request($('.auth-card'),()=>{state.users[state.pendingEmail].verified=true;state.email=state.pendingEmail;persist();$('#demoTools').open=false;go(current().complete?'recommend':'academic');});break;
case'verify-check':await request($('.auth-card'),()=>{if(state.users[state.pendingEmail]?.verified){state.email=state.pendingEmail;persist();go(current().complete?'recommend':'academic');}else formError($('.auth-card'),'아직 메일 확인이 완료되지 않았어요. 메일의 확인 링크를 눌러주세요.');});break;
case'resend':await request($('.auth-card'),()=>{linkExpired=false;resendUntil=Date.now()+30000;render();showToast('확인 메일을 다시 요청했어요. (발송 시연)');});break;
case'link-expired':if(!['verify','reset-password','reset-sent'].includes(route)){showToast('메일 확인 또는 재설정 화면에서 사용해 주세요.');break;}linkExpired=true;resetValid=false;$('#demoTools').open=false;if(route==='reset-sent')go('reset-password');else render();break;
case'reset-link':if(!state.resetEmail||!['reset-sent','reset-password'].includes(route)){showToast('먼저 비밀번호 재설정 메일을 요청해 주세요.');break;}if(linkExpired){showToast('만료된 링크예요. 새 링크를 요청해 주세요.');break;}resetValid=true;$('#demoTools').open=false;go('reset-password');break;
case'academic-back':go('academic');break;
case'profile':openProfile();break;
case'close-modal':closeModal();break;
case'source':showToast('가상 공지에는 원문 URL이 없어요. 실제 API 연결 시 원문으로 이동해요.');break;
case'urgent':filters[route].urgent=!filters[route].urgent;render();break;
case'reset-filters':Object.assign(filters[route],{search:'',category:'전체',urgent:false,source:'전체 출처'});listStates[route]='ready';render();break;
case'retry-list':listStates[route]='loading';renderList(route);const success=await request($('#'+route),()=>{listStates[route]='ready';renderList(route);});if(!success){listStates[route]='error';renderList(route);}break;
case'prev-month':case'next-month':month+=b.dataset.action==='prev-month'?-1:1;if(month<0){month=11;year--;}if(month>11){month=0;year++;}renderCal();break;
}});
document.addEventListener('input',e=>{if(e.target.id==='listSearch'){filters[safeRoute()].search=e.target.value;listStates[safeRoute()]='ready';renderList(safeRoute());}});
document.addEventListener('change',e=>{if(e.target.id==='sourceFilter'){filters.new.source=e.target.value;renderList('new');}});
document.addEventListener('keydown',e=>{const modal=$('.detail.open,.profile-modal.open');if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(x=>x.offsetParent!==null&&!x.closest('fieldset:disabled'));if(!nodes.length){e.preventDefault();return;}if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
function updateResend(){const b=$('[data-action=resend]');if(!b||busy)return;const seconds=Math.max(0,Math.ceil((resendUntil-Date.now())/1000));b.disabled=seconds>0;b.textContent=seconds?`확인 메일 다시 보내기 (${seconds}초)`:'확인 메일 다시 보내기';}
setInterval(updateResend,1000);
window.addEventListener('hashchange',()=>{if(busy){history.replaceState(null,'','#/'+lastRoute);return;}render();lastRoute=safeRoute();});let lastRoute=safeRoute();render();
</script>
</body>
