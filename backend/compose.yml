# APP_ENV=production에는 외부 PostgreSQL 설정이 필요합니다.
# 첫 배포 전에 실행: docker compose run --rm api python -m app.cli init-db
services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:3104:3104"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3104/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
